site_name: Portafolio de Proyecto de Ingeniería IV
site_author: Mauro David Sánchez

theme:
  name: material
  features:
    - navigation.tabs # Crea un menú superior elegante
    - navigation.top # Agrega un botón para volver rápidamente arriba
    - header.autohide # Oculta la barra al bajar para no estorbar la lectura
  palette:
    # Configuración del modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    # Configuración del modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/robot-industrial # Un detalle temático para la barra superior
